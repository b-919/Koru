apply plugin: "java-library"

java {
    sourceCompatibility = 17
    targetCompatibility = 17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java.srcDirs = [ "src/" ]

def TEXPACK_DIR = "$System.env.TEXPACK_DIR"

task packSprites(type: Exec){
	commandLine "java", "-cp", TEXPACK_DIR, "arc.packer.TexturePacker", "assets-raw/sprites/", "assets/sprites/", "sprites"
}

task packUI(type: Exec){
	commandLine "java", "-cp", TEXPACK_DIR, "arc.packer.TexturePacker", "assets-raw/ui/", "assets/ui/", "uiskin"
}

task pack(){
	dependsOn 'packSprites'
	dependsOn 'packUI'
}

eclipse.project {
    name = appName + "-core"
}