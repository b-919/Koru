allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "Koru"
        arcVersion = '160.4'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}

project(":desktop") {
    apply plugin: "java"

    dependencies {
        implementation project(":core")
        implementation "com.github.Anuken.Arc:backend-sdl:$arcVersion"
        implementation "com.github.Anuken.Arc:natives-desktop:$arcVersion"
    }
}

project(":server") {
    apply plugin: "java"

    dependencies {
        implementation project(":core")
        implementation "com.github.Anuken.Arc:backend-headless:$arcVersion"
        implementation "com.github.Anuken.Arc:backend-sdl:$arcVersion"
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api "com.github.Anuken.Arc:arc-core:$arcVersion"
        api "com.github.Anuken.Arc:freetype:$arcVersion"
        api "com.github.Anuken.Arc:natives-freetype-desktop:$arcVersion"
        api "com.github.Anuken.Arc:arcnet:$arcVersion"

        // standalone Kryo for serialization (arcnet doesn't include it by default)
        api "com.esotericsoftware:kryo:4.0.0"
    }
}

tasks.eclipse.doLast {
    delete ".project"
}